<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>charity: water</title>
    <meta
      name="description"
      content="Small actions. Big impact. Support clean water for communities in need."
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand" aria-label="charity: water logo">
          <img src="img/cw_logo-2.png" alt="charity: water logo" class="logo" />
        </div>

        <nav class="main-nav" aria-label="Main navigation">
          <a href="#">Our Work</a>
          <a href="#">The Water Crisis</a>
          <a href="#">Impact</a>
          <a href="#">Get Involved</a>
        </nav>

        <a href="#" class="nav-donate">Donate</a>
      </header>

      <main class="hero">
        <h1>
          <span>Small Actions.</span>
          <span>Big Impact.</span>
        </h1>

        <p class="supporting-copy">
          You don't need to give a lot to make a difference. Small donations can
          come together to help bring clean water to communities in need.
        </p>

        <form class="donation-form" action="#" method="get">
          <div class="amount-row" aria-label="Choose a donation amount">
            <input type="radio" name="donation" id="amount-5" checked />
            <label for="amount-5">$5</label>

            <input type="radio" name="donation" id="amount-10" />
            <label for="amount-10">$10</label>

            <input type="radio" name="donation" id="amount-20" />
            <label for="amount-20">$20</label>

            <input type="radio" name="donation" id="amount-other" />
            <label for="amount-other">Other</label>
          </div>

          <button type="submit" class="impact-button">
            MAKE MY IMPACT <span aria-hidden="true">→</span>
          </button>
          <p class="fine-print">EVERY CONTRIBUTION MATTERS.</p>
        </form>

        <div class="photo-row" aria-label="Impact photos">
          <div class="photo-card">
            <img
              src="img/Screenshot%202026-09-17%20at%208.39.50%E2%80%AFPM.png"
              alt="People gathering around a water project"
            />
          </div>

          <div class="photo-card">
            <img
              src="img/Screenshot%202026-09-17%20at%208.40.03%E2%80%AFPM.png"
              alt="A child using clean water"
            />
          </div>

          <div class="photo-card">
            <img
              src="img/Screenshot%202026-09-17%20at%208.40.30%E2%80%AFPM.png"
              alt="Children standing together with clean water access"
            />
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
